<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Metro Reliability</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a href="#/" class="brand">Metro Reliability</a>
    <nav><a href="#/">Search</a> <a href="#/worst">Worst routes</a> <a href="#/alerts">My alerts</a></nav>

  <div class="search">
