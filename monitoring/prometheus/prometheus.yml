# Prometheus: every 15 seconds, fetch /metrics from each service and store the numbers.
global:
  scrape_interval: 15s       # how often to collect
  evaluation_interval: 15s   # how often to check the alert rules

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: ingester
    static_configs:
      - targets: ["ingester:9100"]    # Compose service name + metrics port
  - job_name: processor
    static_configs:
      - targets: ["processor:9100"]
  - job_name: notifier
    static_configs:
      - targets: ["notifier:9100"]
