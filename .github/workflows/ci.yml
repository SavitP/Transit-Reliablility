# Continuous integration: on every push and pull request, run the tests, then build the
# Docker image. On the main branch, also publish the image to GitHub's container registry.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # A throwaway TimescaleDB for the integration tests, the same version we use locally.
    services:
      db:
        image: timescale/timescaledb:2.30.1-pg17
        env:
          POSTGRES_USER: transit
          POSTGRES_PASSWORD: ci-only-password   # not a real secret: this database lives for one run
          POSTGRES_DB: transit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U transit -d transit_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip                    # reuse downloaded packages between runs

      - run: pip install -r requirements-dev.txt

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql://transit:ci-only-password@localhost:5432/transit_test
        run: pytest -v

      - name: Check docker-compose.yml is valid
        env:
          POSTGRES_PASSWORD: dummy
          GRAFANA_ADMIN_PASSWORD: dummy
        run: docker compose config --quiet

      - name: Check Prometheus config and alert rules
        run: >-
          docker run --rm -v "$PWD/monitoring/prometheus:/etc/prometheus:ro"
          --entrypoint promtool prom/prometheus:v3.15.0
          check config /etc/prometheus/prometheus.yml

  build:
    needs: test                         # only build if every test passed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                   # allows publishing to ghcr.io with the built-in token

    steps:
      - uses: actions/checkout@v7

      # Image names must be lowercase; the repo name has capitals.
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # created automatically for each run

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}   # other branches: build only, to check it works
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha          # reuse unchanged layers from earlier runs
          cache-to: type=gha,mode=max
