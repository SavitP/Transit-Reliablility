# Runs the whole system with one command:  docker compose up -d
# Compose reads .env automatically, so ${POSTGRES_PASSWORD} is filled in from there.
#
#   ingester ──▶ redpanda (topic "vehicle-positions") ──▶ processor ──▶ db ◀── api ◀── your browser
#   (fetches)    (holds messages until they're read)       (delays)     (stores)  (answers questions)
#
#   prometheus collects health numbers from ingester + processor every 15s; grafana draws them.

services:
  db:
    image: timescale/timescaledb:2.30.1-pg17
    environment:
      POSTGRES_USER: transit
      POSTGRES_DB: transit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"          # so psql on your Mac can still reach it
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:                        # "is the database ready for connections yet?"
      test: ["CMD", "pg_isready", "-U", "transit", "-d", "transit"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redpanda:
    image: redpandadata/redpanda:v26.2.3
    command:
      - redpanda
      - start
      - --mode=dev-container            # sensible settings for a single-machine setup
      - --smp=1                         # use 1 CPU core
      - --memory=1G
      # Two "doors": one for containers on the Compose network, one for your Mac.
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      # The address each door tells clients to use when they reconnect.
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "127.0.0.1:19092:19092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data   # messages survive restarts too
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 5s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  ingester:
    build: .
    command: ["python", "ingester.py"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  processor:
    build: .
    command: ["python", "processor.py"]
    environment:
      # Inside the Compose network each service is reachable by its name ("db", "redpanda").
      DATABASE_URL: postgresql://transit:${POSTGRES_PASSWORD}@db:5432/transit
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    volumes:
      - schedule-cache:/app/data        # keep the downloaded schedule between restarts
    depends_on:
      db:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: .
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql://transit:${POSTGRES_PASSWORD}@db:5432/transit
    ports:
      - "127.0.0.1:8000:8000"           # open http://localhost:8000 in your browser
    depends_on:
      db:
        condition: service_healthy
      processor:
        condition: service_started      # the processor creates the tables on startup
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d    # keep 30 days of measurements
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro   # our config files (read-only)
      - prometheus-data:/prometheus                  # the stored measurements
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/transit.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  db-data:
    name: transit-db-data               # the same volume since Phase 3, so no data is lost
  schedule-cache:
  redpanda-data:
  prometheus-data:
  grafana-data:
